</svg></div><h1>Tủ Đồ Mỗi Ngày</h1><h2>PHỐI ĐỒ · ÁO KHOÁC</h2><p>Bạn thích cách phối số mấy?</p><div class=cta>Link áo ở bình luận ghim</div></div>
<script>
const O=[["Phối quần jeans ống rộng + Sneaker trắng.", "Phong cách: Năng động, đi học đi làm đều hợp."], ["Phối chân váy xếp ly đen + Boots cổ ngắn.", "Phong cách: Cá tính, chuẩn street style Hàn."], ["Phối quần cargo be + Giày chunky.", "Phong cách: Streetwear thoải mái, đi chơi cả ngày."], ["Phối chân váy maxi trắng + Sandal da.", "Phong cách: Thể thao mix nữ tính, đi biển cực xinh."], ["Phối quần short jean + Sneaker đỏ.", "Phong cách: Trẻ trung, nổi bật khi dạo phố."]];
const INTRO=1.6, SEG=5.4, N=O.length, END=2.4, TOT=INTRO+SEG*N+END;
// Bố cục v3 – BẢN C (chốt 28/10/2026, người dùng duyệt)
// Chữ y 290–390 | Món chính x30–470 y370–760 | Món phối (quần/váy) x20–490 y770–1330 | Giày x50–450 y1335–1485 | Người mẫu x440–990 y370–1900
const BX={x:20,y:770,w:470,h:560}, SX={x:50,y:1335,w:400,h:150};
function ease(x){return x<0?0:x>1?1:1-Math.pow(1-x,3)}
function setIt(el,box,p){el.style.left=box.x+'px';el.style.top=box.y+'px';el.style.width=box.w+'px';el.style.height=box.h+'px';el.style.opacity=p;el.style.transform=`translateY(${(1-p)*40}px) scale(${0.94+0.06*p})`}
window.render=function(t){
  let cap='Áo khoác gió xám phối với…';
  for(let i=0;i<N;i++){
    const t0=INTRO+i*SEG, lt=t-t0, on=(lt>=0&&lt<SEG);
    const out=on?ease((SEG-lt)/0.35):0;
    setIt(document.getElementById('b'+i),BX,on?Math.min(ease(lt/0.4),out):0);
    setIt(document.getElementById('s'+i),SX,on?Math.min(ease((lt-0.6)/0.4),out):0);
    const m=document.getElementById('m'+i); const pm=on?Math.min(ease((lt-1.5)/0.5),out):0;
    m.style.opacity=pm; m.style.transform=`translateX(${(1-pm)*80}px)`;
    if(on) cap = lt<2.7 ? O[i][0] : O[i][1];
  }
  const pe=ease((t-(INTRO+SEG*N))/0.5); document.getElementById('end').style.opacity=pe;
  document.getElementById('cap').textContent = pe>0.5 ? '' : cap;
  document.getElementById('jk').style.opacity = 1;
};
window.TOT=TOT;
</script></body></html>
